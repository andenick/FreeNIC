name: CI

# FreeNIC's warehouse and Outputs/ artifacts (parquet/duckdb, PROVENANCE.csv, freenic_py
# package, Technical/ trees) are gitignored and absent in a checkout, so this workflow
# runs only the checks that operate on TRACKED files: dependency install from
# pipeline/requirements.txt, a syntax/compile pass over the tracked pipeline + site +
# release-tools code, and targeted AST smoke parses. The data-dependent suite
# (13_validate.py + the warehouse tests) runs locally against the built warehouse —
# see Outputs/QUICK_START.md. (2026-10-04: first run failed on Install dependencies —
# the original steps referenced this repo's gitignored paths; rewritten file-only.)

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [ "3.11", "3.12", "3.13" ]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r pipeline/requirements.txt
          pip install pytest

      - name: Compile pass (tracked pipeline + site + release-tools code)
        run: |
          python -m compileall -q pipeline/scripts site/app release-tools

      - name: AST smoke parses (tracked entry points)
        run: |
          python - <<'EOF'
          import ast, sys
          from pathlib import Path
          targets = [
              "pipeline/scripts/12_export_parquet.py",
              "pipeline/scripts/13_validate.py",
              "pipeline/scripts/45_build_clean_bank_panel.py",
              "pipeline/scripts/49_coverage_matrix.py",
              "pipeline/scripts/50_reconstruct_luck.py",
              "pipeline/scripts/52_validate_reconstruction.py",
              "pipeline/scripts/export_helpers.py",
              "site/app/main.py",
              "release-tools/build_slice.py",
          ]
          missing = [t for t in targets if not Path(t).is_file()]
          if missing:
              sys.exit("missing tracked files: %s" % missing)
          for t in targets:
              ast.parse(Path(t).read_text(encoding="utf-8"))
              print("parses:", t)
          EOF

      - name: Utils import (needs only duckdb/pandas from requirements)
        run: |
          python -c "import duckdb, pandas, yaml; print('query deps import ok')"
